<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>DroidZone | دنیای فناوری</title>
  <meta name="description" content="مقالات و مطالب فناوری در DroidZone">
  <meta name="robots" content="noindex,nofollow">

  <link rel="stylesheet" href="style.css">

  <style>
    body {
      visibility: hidden;
    }

    body.ready {
      visibility: visible;
    }

    .dz-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 16px;
      flex-wrap: wrap;
    }

    .dz-logo {
      font-size: 23px;
      font-weight: 800;
    }

    .dz-nav {
      display: flex;
      gap: 14px;
      align-items: center;
      flex-wrap: wrap;
    }

    .dz-nav a {
      text-decoration: none;
    }

    .dz-main {
      width: min(900px, 92%);
      margin: 35px auto;
    }

    .dz-hero {
      text-align: center;
      padding: 35px 15px;
    }

    .dz-hero h1 {
      font-size: clamp(28px, 6vw, 42px);
      margin-bottom: 10px;
    }

    .dz-search {
      width: 100%;
      padding: 15px;
      border-radius: 15px;
      border: 1px solid #8885;
      background: transparent;
      color: inherit;
      font-size: 16px;
      margin: 20px 0;
    }

    .dz-button {
      display: inline-block;
      padding: 12px 20px;
      border-radius: 13px;
      background: var(--accent, #8eebcd);
      color: #10221d;
      text-decoration: none;
      font-weight: bold;
      border: 0;
      cursor: pointer;
    }

    .dz-section-title {
      margin: 25px 0 15px;
    }

    #article-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 15px;
    }

    .dz-article {
      padding: 18px;
      border-radius: 18px;
      border: 1px solid #8884;
      background: #8881;
    }

    .dz-article h3 {
      margin-top: 0;
    }

    .dz-article p {
      line-height: 1.9;
    }

    .dz-empty {
      text-align: center;
      padding: 25px;
      opacity: .7;
    }

    .dz-footer {
      text-align: center;
      padding: 25px;
      opacity: .7;
    }
  </style>

  <script>
    (async function () {
      try {
        const response = await fetch("/.netlify/functions/me", {
          credentials: "include",
          cache: "no-store"
        });

        const data = await response.json();

        if (!response.ok || !data.success || !data.user) {
          location.replace("auth.html");
          return;
        }

        document.documentElement.classList.add("dz-authenticated");
        document.addEventListener("DOMContentLoaded", () => {
          document.body.classList.add("ready");
        });

      } catch (error) {
        location.replace("auth.html");
      }
    })();
  </script>
</head>

<body>

  <header class="dz-header">
    <div class="dz-logo">DroidZone</div>

    <nav class="dz-nav">
      <a href="index.html">خانه</a>
      <a href="#articles">مقاله‌ها</a>
      <a href="submit.html">ارسال مقاله</a>
      <a href="profile.html">پروفایل</a>
    </nav>
  </header>

  <main class="dz-main">

    <section class="dz-hero">
      <h1>دنیای فناوری، یک‌جا</h1>
      <p>جدیدترین مطالب و مقاله‌های فناوری را در DroidZone بخوان.</p>

      <a class="dz-button" href="submit.html">
        + ارسال مقاله
      </a>
    </section>

    <section id="articles">
      <h2 class="dz-section-title">مقاله‌ها</h2>

      <input
        id="search"
        class="dz-search"
        type="search"
        placeholder="جست‌وجوی مقاله..."
        autocomplete="off"
      >

      <div id="article-list"></div>

      <p id="empty" class="dz-empty">
        در حال بارگذاری مقاله‌ها...
      </p>
    </section>

  </main>

  <footer class="dz-footer">
    © <span id="year"></span> DroidZone
  </footer>

  <script src="script.js" defer></script>

</body>
</html>
